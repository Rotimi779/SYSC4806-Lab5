<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Address Book</title>
</head>

<body>

<h1>Address Book </h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Phone Number</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="buddy : ${addressBook.buddies}">
        <td th:text="${buddy.name}"></td>
        <td th:text="${buddy.address}"></td>
        <td th:text="${buddy.phoneNumber}"></td>
    </tr>
    </tbody>
</table>

</body>

</html>
